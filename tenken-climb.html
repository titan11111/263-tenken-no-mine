<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>天剣の峰 — 断崖を登り、伝説の剣を抜け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --snow:#EEF1F4; --slate:#2E3338; --gold:#E8C46A; --ice:#9FD8FF; --danger:#E0674F;
  --veil:rgba(18,22,28,.58); --line:rgba(238,241,244,.3); --bg:#1b2027;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --veil:rgba(10,13,18,.68); --bg:#14181e; } }
:root[data-theme="dark"]{ --veil:rgba(10,13,18,.68); --bg:#14181e; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--snow);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.shadow{text-shadow:0 1px 2px rgba(0,0,0,.55),0 2px 14px rgba(0,0,0,.35)}

.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 18px) 0 calc(env(safe-area-inset-left,0px) + 18px);
  pointer-events:none;opacity:0;transition:opacity .8s}
.hud.on{opacity:1}
.alt{font-weight:800;font-size:clamp(32px,8vw,48px);line-height:1;letter-spacing:.01em}
.alt small{font-size:.4em;font-weight:600;margin-left:5px}
.togo{font-size:13px;margin-top:6px;opacity:.9}
.grip{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12px}
.bar{width:min(42vw,200px);height:7px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:var(--gold);transition:background .3s}
body.low .bar{animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 1px var(--danger),0 0 12px var(--danger)}}
.right{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.6}

#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,8px);width:max-content;max-width:88vw;text-align:center;
  font-size:clamp(17px,4.6vw,22px);font-weight:600;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 勇者の独り言：頭の上に浮くもくもく吹き出し */
#bubble{position:fixed;left:0;top:0;width:min(62vw,300px);pointer-events:none;z-index:4;opacity:0;
  transform:translate(-50%,-100%);transform-origin:50% 100%;transition:opacity .2s}
#bubble.on{opacity:1;animation:puff .26s cubic-bezier(.2,1.5,.4,1)}
@keyframes puff{from{transform:translate(-50%,-100%) scale(.7)}to{transform:translate(-50%,-100%) scale(1)}}
#bubbleT{margin:0;padding:24px 30px 26px;color:#14160c;font-size:clamp(13px,3.5vw,16px);font-weight:800;
  line-height:1.6;text-align:center;letter-spacing:.01em;
  background:center/100% 100% no-repeat url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20300%20124'%20preserveAspectRatio='none'%3E%3Cpath%20d='M40%20100%20Q14%2098%2016%2078%20Q2%2060%2020%2048%20Q18%2026%2044%2030%20Q58%2010%2086%2020%20Q112%206%20140%2020%20Q168%208%20190%2022%20Q220%2010%20238%2028%20Q268%2026%20272%2048%20Q292%2060%20278%2078%20Q288%2096%20260%20100%20Q242%20114%20212%20106%20Q184%20118%20156%20108%20Q126%20118%2098%20108%20Q62%20114%2040%20100%20Z'%20fill='%23f4f1ea'%20stroke='%2314160c'%20stroke-width='5'%20stroke-linejoin='round'/%3E%3C/svg%3E");
  filter:drop-shadow(4px 5px 0 rgba(12,13,16,.45))}
#bubble i{position:absolute;display:block;background:#f4f1ea;border:3px solid #14160c;border-radius:50%}
#bubble .p1{width:17px;height:17px;bottom:-13px;left:44%}
#bubble .p2{width:10px;height:10px;bottom:-30px;left:39%}
#pull{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);
  width:min(70vw,320px);text-align:center;display:none}
#pull.on{display:block}
#pull .bar{width:100%;height:10px;margin-top:8px}
#pull .bar i{background:linear-gradient(90deg,var(--gold),#fff6d6)}

#joyZone{position:fixed;left:0;bottom:0;width:55%;height:55%;display:none}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 38px);
  width:124px;height:124px;border-radius:50%;border:1.5px solid var(--line);background:rgba(20,24,30,.22);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(238,241,244,.28);box-shadow:0 0 0 1.5px rgba(238,241,244,.5)}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);
  width:92px;height:92px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(232,196,106,.16);
  color:var(--snow);font-size:20px;font-weight:800;display:none;cursor:pointer}
#act:active{background:rgba(232,196,106,.4)}
#act:focus-visible,button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
body.playing #joyZone,body.playing #joy,body.playing #act{display:block}
.keys{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font-size:12px;opacity:.75;display:none;white-space:nowrap}
@media (hover:hover) and (pointer:fine){
  body.playing #joy,body.playing #act{display:none}
  body.playing .keys{display:block}
}

.screen{position:fixed;inset:0;z-index:6;opacity:1;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-right,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 32px) calc(env(safe-area-inset-left,0px) + 28px);
  background:linear-gradient(180deg,rgba(6,7,9,0) 18%,rgba(6,7,9,.72) 62%,#07080c 100%);transition:opacity .9s}
.screen::before{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;pointer-events:none;
  background:repeating-linear-gradient(90deg,#14160c 0 16px,#d6a31a 16px 32px)}
.screen.hide{opacity:0;pointer-events:none}
.vtitle{writing-mode:vertical-rl;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(48px,13vw,96px);line-height:1;letter-spacing:.06em;margin:0;align-self:flex-start;order:2;
  color:#f4f1ea;text-shadow:5px 4px 0 #111,-3px -2px 0 #d6a31a}
.seal{display:inline-block;margin:0 0 12px;font-family:"Dela Gothic One",sans-serif;font-size:13px;letter-spacing:.28em;color:#e24b3a;
  border:2px solid #e24b3a;padding:4px 8px 4px 12px;transform:rotate(-6deg)}
.story{max-width:22em;order:1;background:rgba(12,13,16,.92);color:#f4f1ea;border:3px solid #d6a31a;box-shadow:7px 7px 0 #6e1c24;padding:16px 18px 18px}
.lead{font-family:"Dela Gothic One",sans-serif;font-size:clamp(22px,6vw,34px);font-weight:400;line-height:1.3;letter-spacing:.08em;margin:0 0 18px}
.story p{line-height:1.8;margin:0 0 14px;font-size:15px}
.cta{appearance:none;border:3px solid #d6a31a;border-radius:0;background:#0c0e12;color:#f4f1ea;font:inherit;font-weight:700;font-size:18px;
  min-height:56px;padding:14px 34px;cursor:pointer;letter-spacing:.16em;box-shadow:6px 6px 0 #6e1c24;transform:skewX(-8deg);transition:transform .08s ease}
.cta:active{transform:skewX(-8deg) scale(.92)}
.best{font-size:13px;opacity:.8;margin-top:12px!important}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;width:max-content;margin:0 0 22px;font-size:15px;font-variant-numeric:tabular-nums}
.stats dt{opacity:.7}.stats dd{margin:0;font-weight:700;color:#d6a31a}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 1.6s}
@media (max-width:640px){
  .screen{flex-direction:column;align-items:stretch;justify-content:flex-end}
  .vtitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);right:calc(env(safe-area-inset-right,0px) + 22px)}
}
@media (prefers-reduced-motion:reduce){ .screen,#toast,#flash,#bubble{transition:none} body.low .bar,#bubble.on{animation:none} }
</style>
</head>
<body>
<section class="screen" id="title">
  <h1 class="vtitle">天剣の峰</h1>
  <div class="story shadow">
    <p class="seal">立入禁止</p>
    <p class="lead">百年、抜けない。</p>
    <button class="cta" id="start">登る</button>
    <p class="best" id="best"></p>
  </div>
</section>
<canvas id="c" aria-label="断崖を登る3Dゲーム画面"></canvas>

<div class="hud shadow" id="hud">
  <div>
    <div class="alt mincho"><span id="altv">2,200</span><small>m</small></div>
    <div class="togo" id="togo"></div>
    <div class="grip"><span>握力</span><div class="bar"><i id="gripFill"></i></div></div>
    <div class="togo" id="stance">岩棚で止まると回復</div>
  </div>
  <div class="right"><div id="timev">00:00</div><div id="fallv">落下 0</div></div>
</div>

<div id="toast" class="mincho shadow" role="status" aria-live="polite"></div>
<div id="bubble" aria-hidden="true"><p id="bubbleT" class="mincho"></p><i class="p1"></i><i class="p2"></i></div>

<div id="pull" class="shadow"><div class="mincho">伝説の剣を引き抜く</div><div class="bar"><i id="pullFill" style="transform:scaleX(0)"></i></div></div>

<div id="joyZone"></div>
<div id="joy"><div id="knob"></div></div>
<button id="act" class="mincho" aria-label="跳ぶ">跳ぶ</button>
<div class="keys shadow">移動 WASD / 矢印　岩クリックで手を伸ばす　足場で腕を休める　跳ぶ・抜く スペース</div>

<section class="screen hide" id="end" aria-hidden="true">
  <h2 class="vtitle">抜けた</h2>
  <div class="story shadow">
    <p class="lead">外れた。</p>
    <dl class="stats">
      <dt>時間</dt><dd id="rTime"></dd>
      <dt>落下</dt><dd id="rFall"></dd>
      <dt>最速</dt><dd id="rBest"></dd>
    </dl>
    <button class="cta" id="again">もう一度</button>
  </div>
</section>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260926);
const R=(a,b)=>a+(b-a)*rnd();
const sc=h=>new THREE.Color(h).convertSRGBToLinear();

/* ---------- noise ---------- */
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f);f*=2.03;a*=0.5;}return s/(1-Math.pow(0.5,o));}
function tnoise(x,y,p){const m=v=>((v%p)+p)%p;const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(m(xi),m(yi)),b=hash(m(xi+1),m(yi)),c=hash(m(xi),m(yi+1)),d=hash(m(xi+1),m(yi+1));return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

/* ---------- world ---------- */
// 勇者は1.5倍（root.scale 1.8→2.7）。体格から決まる値はすべて HERO_S から導き、手打ち数値を残さない。
const HERO_S=2.7;
const FEET=0.60*HERO_S;                       // 足裏〜腰原点
const ARM_X=0.30*HERO_S, ARM_Y=0.90*HERO_S;   // 肩の位置
const ARM_SPAN=0.70*HERO_S;                   // 肩〜手首
const HIP_X=0.12*HERO_S, HIP_Y=0.28*HERO_S;   // 股関節の位置
const LEG_SPAN=0.84*HERO_S;                   // 股関節〜足首
const HEAD_Y=1.18*HERO_S;                     // 首の付け根
const Y_TOP=130, GRIP_R=ARM_SPAN*1.06, SW_D=14;
function wallZ(x,y){
  let z=(fbm(x*0.06+10,y*0.05)-0.5)*7;
  z+=(fbm(x*0.25,y*0.22+5,3)-0.5)*1.6;
  z+=Math.pow(Math.abs(Math.sin(y*0.9+fbm(x*0.1,y*0.1)*4)),6)*0.35;
  z-=x*x*0.02;
  return z;
}
function wallClearance(x,y){
  let front=-Infinity;
  for(const dx of [-0.36*HERO_S,0,0.36*HERO_S])for(const dy of [-0.47*HERO_S,0.31*HERO_S,1.19*HERO_S])
    front=Math.max(front,wallZ(x+dx,Math.max(0,y+dy)));
  return front;
}
function plateauY(x,d){
  let y=Y_TOP+0.5*smooth(0,3,d);
  y+=(fbm(x*0.07+40,d*0.07)-0.5)*2.2*smooth(3,12,d);
  y+=Math.max(0,d-32)*0.55*(0.6+fbm(x*0.05,d*0.05));
  y+=Math.max(0,Math.abs(x)-14)*0.5*smooth(0,6,d);
  return y;
}
const altOf=y=>Math.round(2200+Math.max(0,y-FEET)*11.5);
const SUMMIT_ALT=altOf(Y_TOP+FEET);

/* ---------- renderer / scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOGC=new THREE.Color(0x8d9db0);
scene.fog=new THREE.Fog(FOGC,70,560);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,2000);
camera.position.set(38,46,125);

const sunDir=new THREE.Vector3(0.75,0.5,0.45).normalize();
function skyMaterial(){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{hor:{value:FOGC.clone()},zen:{value:new THREE.Color(0.05,0.14,0.40)},sunDir:{value:sunDir}},
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 hor;uniform vec3 zen;uniform vec3 sunDir;varying vec3 vDir;
  void main(){vec3 d=normalize(vDir);float h=d.y;
    vec3 col=mix(hor,zen,pow(clamp(h,0.,1.),0.5));
    col=mix(col,hor*0.85,smoothstep(0.0,-0.3,h));
    float s=max(dot(d,sunDir),0.);
    col+=vec3(1.0,0.82,0.55)*(pow(s,900.)*30.+pow(s,8.)*0.22);
    gl_FragColor=vec4(col,1.);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`});}
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),skyMaterial());
sky.frustumCulled=false; scene.add(sky);
try{
  const envScene=new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,16),skyMaterial()));
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(envScene,0,0.1,100).texture;
}catch(e){}

const hemi=new THREE.HemisphereLight(0xcfe3ff,0x4a4038,0.35); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,2.6);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:160});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.04;
scene.add(sun,sun.target);

/* ---------- textures ---------- */
function makeRockTex(){
  const S=256,cv=document.createElement('canvas');cv.width=cv.height=S;const ctx=cv.getContext('2d');const img=ctx.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    let v=0,a=0.5,f=8;for(let o=0;o<5;o++){v+=a*tnoise(x/S*f+o*3,y/S*f,f);f*=2;a*=0.5;}
    const cr=tnoise(x/S*6,y/S*6+3,6);const crack=smooth(0.03,0,Math.abs(cr-0.5));
    const c=clamp(0.62+v*0.42-crack*0.3,0,1)*255;const i=(y*S+x)*4;img.data[i]=img.data[i+1]=img.data[i+2]=c;img.data[i+3]=255;}
  ctx.putImageData(img,0,0);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
function makeSoftTex(blobs){
  const S=128,cv=document.createElement('canvas');cv.width=cv.height=S;const ctx=cv.getContext('2d');
  const n=blobs?11:1;
  for(let i=0;i<n;i++){const x=blobs?S/2+R(-28,28):S/2,y=blobs?S/2+R(-14,14):S/2,r=blobs?R(20,40):S/2;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,'+(blobs?0.55:1)+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,S,S);}
  return new THREE.CanvasTexture(cv);
}
const rockTex=makeRockTex();
const wallTex=rockTex.clone(); wallTex.needsUpdate=true; wallTex.repeat.set(18,42);
const cloudTex=makeSoftTex(true), glowTex=makeSoftTex(false);

/* ---------- cliff + plateau (one continuous mesh) ---------- */
const WALL_W=90,Y0=-14,Y1=Y_TOP+70;
const wg=new THREE.PlaneGeometry(WALL_W,Y1-Y0,150,Math.round((Y1-Y0)*1.8));
{
  const P=wg.attributes.position,n=P.count,raw=new Float32Array(n),plat=new Uint8Array(n);
  for(let i=0;i<n;i++){
    const x=P.getX(i),yr=P.getY(i)+(Y1+Y0)/2;raw[i]=yr;
    const det=(vnoise(x*1.7,yr*1.7)-0.5)*0.28+(vnoise(x*4.1,yr*4.3)-0.5)*0.1;
    let y,z;
    if(yr<=Y_TOP){y=yr;z=wallZ(x,y)+det;}
    else{const d=yr-Y_TOP;y=plateauY(x,d)+det*0.4;z=wallZ(x,Y_TOP)-d;plat[i]=1;}
    P.setXYZ(i,x,y,z);
  }
  wg.computeVertexNormals();
  const N=wg.attributes.normal,C=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const x=P.getX(i),yr=raw[i],ny=N.getY(i);
    const f1=fbm(x*0.12,yr*0.3+7,3);
    let r=lerp(0.36,0.55,f1),g=lerp(0.34,0.51,f1),b=lerp(0.31,0.46,f1);
    const st=0.86+0.14*Math.sin(yr*1.7+f1*5);r*=st;g*=st;b*=st;
    const ir=smooth(0.62,0.8,fbm(x*0.2+50,yr*0.08,3));r+=ir*0.1;g+=ir*0.03;

  const across=Math.sqrt(Math.max(0,limb.ul*limb.ul-along*along));
  const elbow=new THREE.Vector3().copy(dir).multiplyScalar(along).addScaledVector(bendDir,across);
  const forearm=new THREE.Vector3().copy(dir).multiplyScalar(len).sub(elbow);

  else if(rig.legL.t<1)wS='R';else if(rig.legR.t<1)wS='L';
  else if(rig.legL.hold&&!rig.legR.hold)wS='L';else if(rig.legR.hold&&!rig.legL.hold)wS='R';

const REACH=ARM_SPAN*2.5;   // 一手で運べる体の距離

  const hy=player.y+ARM_Y, lx=player.x-ARM_X, rx=player.x+ARM_X;
  return Math.hypot(hold.x-lx,hold.y-hy)<=Math.hypot(hold.x-rx,hold.y-hy)?'L':'R';

function reachHold(hold){

  if(dist<0.08&&player.grip===hold&&player.aimHand===hand)return;
  const reachCost=2.6+dist*2.0;
  if(player.stamina<reachCost){toast('握力が足りない。足場か岩棚を探せ',1.6);return;}
  player.stamina-=reachCost;
  player.reach={hold,hand,t:0,dur:0.2+dist*0.07,x0:player.x,y0:player.y,x1,y1};

function holdScreen(h,rect){
  proj.set(h.mesh.position.x,h.mesh.position.y,h.mesh.position.z);proj.project(camera);

function pickHold(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  camera.updateMatrixWorld();
  const list=holds.filter(h=>!h.gone);
  let best=null,bd=64;
  for(const h of list){
    const p=holdScreen(h,rect);if(!p)continue;
    const d=Math.hypot(p.sx-x,p.sy-y);
    if(d<bd){bd=d;best=h;}
  }
  if(best)return best;
  ndc.x=(x/rect.width)*2-1;ndc.y=-(y/rect.height)*2+1;
  for(const h of list)h.mesh.updateMatrixWorld();
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(list.map(h=>h.mesh),false);
  if(!hits.length)return null;
  const hit=list.find(h=>h.mesh===hits[0].object);
  const p=hit&&holdScreen(hit,rect);
  if(!p||Math.hypot(p.sx-x,p.sy-y)>64)return null;
  return hit;
}

function ledgeAt(x,y,lo,hi){for(const l of LEDGES){if(Math.abs(x-l.x)<l.w/2-0.3&&y>=l.y+lo&&y<=l.y+hi)return l;}return null;}

function settleOnLedge(l){player.y=l.y+FEET;player.ledge=l;player.grip=null;player.support=2;}
function collideWithLedges(oldX,oldY){
  const head=HEAD_Y+0.48*HERO_S,eps=0.02;
  for(const l of LEDGES){if(l.ground)continue;
    const edge=l.w/2-0.3,inside=Math.abs(player.x-l.x)<edge;
    if(!inside)continue;
    const bottom=l.y-0.9,feet=player.y-FEET;
    // The ledge is solid from below and at its sides, not just at its top.
    if(oldY+head<=bottom+eps&&player.y+head>bottom){
      player.y=bottom-head;player.reach=null;player.lunge=0;return;
    }
    if(Math.abs(oldX-l.x)>=edge&&feet<l.y-eps&&player.y+head>bottom){
      player.x=l.x+Math.sign(oldX-l.x)*edge;player.reach=null;player.lunge=0;return;

}

    if(r.y<player.y-25||state.mode==='walk'||state.mode==='pull'){scene.remove(r.m,r.ring);rocks.splice(i,1);}}
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.vy-=20*dt;d.m.position.y+=d.vy*dt;d.m.position.x+=d.vx*dt;d.m.position.z+=1.5*dt;d.m.rotation.x+=dt*5;
    if(d.m.position.y<player.y-30){scene.remove(d.m);debris.splice(i,1);}}
}

/* ---------- camera ---------- */
const camPos=new THREE.Vector3().copy(camera.position),camLook=new THREE.Vector3(0,72,0),tmpP=new THREE.Vector3(),tmpL=new THREE.Vector3();
function updateCamera(dt){
  const m=state.mode,hp=hero.position;
  if(m==='title'){tmpP.set(38+Math.sin(state.t*0.1)*6,46,125);tmpL.set(0,72,0);}
  else if(m==='climb'||m==='falling'){const wz=wallZ(player.x,player.y),dist=camera.aspect<1?17.5:13.6;
    tmpP.set(player.x*0.75+2.8,player.y+0.9,wz+dist);tmpL.set(player.x*0.9,player.y+3.0,wz);}
  else if(m==='mantle'||m==='walk'){tmpP.set(hp.x+2,hp.y+3.5,hp.z+8);tmpL.set(hp.x,hp.y+1.1,hp.z-5);}
  else if(m==='pull'){tmpP.set(swX+4.2,swGround+3.6,swZ+4.2);tmpL.set(swX,swGround+1.6,swZ+0.5);}
  else{const a=0.7+state.vt*0.3;tmpP.set(hp.x+Math.sin(a)*8,hp.y+2.2,hp.z+Math.cos(a)*8);tmpL.set(hp.x,hp.y+1.3,hp.z);}
  const k=1-Math.exp(-(m==='title'?1:3.5)*dt);camPos.lerp(tmpP,k);camLook.lerp(tmpL,k);
  camera.position.copy(camPos);
  if(state.shake>0){camera.position.x+=(Math.random()-0.5)*state.shake;camera.position.y+=(Math.random()-0.5)*state.shake;state.shake=Math.max(0,state.shake-dt*1.2);}
  camera.lookAt(camLook);sky.position.copy(camera.position);
}

/* ---------- HUD ---------- */
let lastAlt=-1,lastSec=-1;
function updateHud(){
  const a=altOf(state.mode==='climb'||state.mode==='falling'?player.y:Y_TOP+FEET);
  if(a!==lastAlt){lastAlt=a;$('altv').textContent=a.toLocaleString('ja-JP');$('togo').textContent=a>=SUMMIT_ALT?'山頂':'頂まで あと '+(SUMMIT_ALT-a).toLocaleString('ja-JP')+' m';}
  const s=clamp(player.stamina,0,100);$('gripFill').style.transform=`scaleX(${s/100})`;$('gripFill').style.background=s<30?'var(--danger)':'var(--gold)';
  $('stance').textContent=player.ledge?(player.ledge.ground?'地面に立っている':'岩棚に立っている｜停止で握力回復'):
    player.support===2?'両足で踏ん張る：停止で微回復':player.support===1?'片足で踏ん張る：停止で微回復':'足場なし：握力消費が大きい';
  document.body.classList.toggle('low',s<30&&state.mode==='climb');
  const sec=Math.floor(state.time);if(sec!==lastSec){lastSec=sec;$('timev').textContent=fmt(state.time);}
}

/* ---------- loop ---------- */
const clock=new THREE.Clock();
let titleDrawn=false;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.08);state.t+=dt;
  const m=state.mode;
  if(m==='title'){
    if(!titleDrawn){
      hero.position.set(player.x,player.y,wallZ(player.x,player.y)+0.47*HERO_S);
      pose('stand',0,dt);
      renderer.render(scene,camera);
      titleDrawn=true;
    }
    return;
  }
  if(m==='climb'||m==='falling'||m==='mantle'||m==='walk'||m==='pull')state.time+=dt;
  if(m==='climb')updateClimb(dt);
  else if(m==='falling')updateFall(dt);
  else updateSummit(dt);
  updateHazards(dt);
  sun.target.position.copy(hero.position);sun.position.copy(hero.position).addScaledVector(sunDir,70);
  const hy=hero.position.y;snowMat.opacity=smooth(55,105,hy)*0.85;
  if(snowMat.opacity>0.01){const wx=gust.active?gust.dir*6:0.4;for(let i=0;i<NP;i++){let x=snowPos[i*3]+wx*dt,y=snowPos[i*3+1]-1.2*dt;
    if(y<-10)y+=22;if(x>15)x-=30;if(x<-15)x+=30;snowPos[i*3]=x;snowPos[i*3+1]=y;}snowGeo.attributes.position.needsUpdate=true;}
  snow.position.set(camera.position.x,camera.position.y,camera.position.z-9);
  streaks.material.opacity=lerp(streaks.material.opacity,gust.active&&m==='climb'?0.32:0,1-Math.exp(-5*dt));
  if(streaks.material.opacity>0.01){const wz=wallZ(player.x,player.y);for(let i=0;i<NS;i++){const s=stData[i];s.x+=gust.dir*26*dt;if(s.x>14)s.x-=28;if(s.x<-14)s.x+=28;
    const x=player.x+s.x,y=player.y+s.y,z=wz+s.z;stPos.set([x,y,z,x-gust.dir*s.l,y,z],i*6);}stGeo.attributes.position.needsUpdate=true;}
  for(const h of holds){if(h.flash>0){h.flash-=dt;h.mesh.scale.setScalar(h.s*(h.flash>0.06?1.22:1));}}
  beamMat.uniforms.uT.value=state.t;
  if(m!=='victory'){swordLight.intensity=2.2+Math.sin(state.t*2)*0.4;glow.scale.setScalar(3.2+Math.sin(state.t*2)*0.25);}
  if(windGain)windGain.gain.value=lerp(windGain.gain.value,0.04+smooth(0,Y_TOP,hy)*0.12+(gust.active?0.25:0),0.05);
  updateCamera(dt);updateHud();updateBubble(dt);
  renderer.render(scene,camera);
}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?68:58;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',onResize);onResize();
frame();
})();
</script>
